# Workflow 2：清理 + 已收集目录 + 补抓缺失资源 — 每天 UTC+8 03:50 运行
#
# 功能：
#   1) 遍历 main 分支，删除 goodurl 分支中已处理（已归档）的 JSON；
#      判定标准：main 分支存在同名【歌名-歌手】文件夹，且其中含有 song.* 音频文件。
#   2) 生成已收集目录：格式【歌名-歌手】，每行一个，纯文本，写到 main 分支的 list.txt。
#      收集器 Worker 收到新报告时会先查 list.txt，已收集过的直接跳过，避免无效循环。
#   3) refetch job：扫描 main 各文件夹的 info.json，把「缺封面 / 缺歌词」的条目汇总成
#      main/missing.txt，并用 info.json 里保留的原始 pic / lrc 链接重新下载补齐。
#      archive workflow 只做软失败记录，重试责任全在这里。
#
# 两个 job 顺序执行（refetch needs cleanup），避免同一轮里两边同时往 main 提交。

name: Cleanup processed goodurl

on:
  schedule:
    - cron: '50 19 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-goodurl
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout goodurl
        uses: actions/checkout@v4
        with:
          ref: goodurl
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Delete archived JSONs + rebuild list.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          JSON_DIR: '' # 必须与 Worker / archive 的 JSON_DIR 一致，默认根目录
        run: |
          python3 - <<'PYEOF'
          import base64
          import os
          import re
          import time
          from pathlib import Path
          import requests

          REPO = os.environ["GH_REPO"]
          TOKEN = os.environ["GH_TOKEN"]
          JSON_DIR = os.environ.get("JSON_DIR", "").strip().strip("/")
          SRC = Path(JSON_DIR) if JSON_DIR else Path(".")

          H = {
            "Authorization": f"Bearer {TOKEN}",
            "Accept": "application/vnd.github+json",
            "X-GitHub-Api-Version": "2022-11-28",
          }
          H_RAW = {**H, "Accept": "application/vnd.github.raw"}
          API = f"https://api.github.com/repos/{REPO}"
          SONG_RE = re.compile(r"^[^/]+/song\.[a-z0-9]{2,5}$", re.IGNORECASE)

          # 1) 遍历 main：一次 trees API 拿到全库文件清单（不下载二进制，库再大也很快），
          #    找出「顶层目录下含有 song.* 音频」的目录 = 已收集集合
          song_dirs = set()
          r = requests.get(f"{API}/git/trees/main?recursive=1", headers=H, timeout=60)
          r.raise_for_status()
          tree = r.json()
          if tree.get("truncated"):
            # 极端规模兜底：退化为根目录清单（排除 .github）
            print("WARN: trees 返回被截断，退化为根目录清单模式")
            d = requests.get(f"{API}/contents?ref=main", headers=H, timeout=30)
            d.raise_for_status()
            song_dirs = {e["name"] for e in d.json() if e.get("type") == "dir" and e["name"] != ".github"}
          else:
            for e in tree.get("tree", []):
              if e.get("type") == "blob" and SONG_RE.match(e.get("path", "")):
                top = e["path"].split("/")[0]
                if top != ".github":
                  song_dirs.add(top)
          print(f"main 已收集: {len(song_dirs)} 首")

          # 2) 删除 goodurl 中已处理过的 JSON
          jsons = sorted([p for p in SRC.glob("*.json") if p.is_file()])
          print(f"goodurl JSON 数: {len(jsons)}")
          deleted, kept = [], []
          for jp in jsons:
            if jp.stem in song_dirs:
              jp.unlink()
              deleted.append(jp.name)
              print(f"[DEL] {jp.name} （main/{jp.stem}/ 已归档）")
            else:
              kept.append(jp.name)
          print(f"清理结果: 删除 {len(deleted)} / 保留 {len(kept)}")

          # 3) 生成已收集目录 → main/list.txt（每行一个【歌名-歌手】，纯文本）
          content = "\n".join(sorted(song_dirs)) + "\n" if song_dirs else ""
          old = requests.get(f"{API}/contents/list.txt?ref=main", headers=H_RAW, timeout=30)
          if old.status_code == 200 and old.text == content:
            print("list.txt 无变化，跳过更新")
          else:
            # 取现有 sha（404 表示首次创建），带冲突重试
            new_b64 = base64.b64encode(content.encode("utf-8")).decode("ascii")
            ok = False
            for attempt in range(3):
              sha = None
              meta = requests.get(f"{API}/contents/list.txt?ref=main", headers=H, timeout=30)
              if meta.status_code == 200:
                sha = meta.json().get("sha")
              body = {
                "message": f"chore: 更新已收集目录 ({len(song_dirs)} 首)",
                "content": new_b64,
                "branch": "main",
                "author": {
                  "name": "lingyicute",
                  "email": "160479206+lingyicute@users.noreply.github.com",
                },
                "committer": {
                  "name": "lingyicute",
                  "email": "160479206+lingyicute@users.noreply.github.com",
                },
              }
              if sha:
                body["sha"] = sha
              put = requests.put(f"{API}/contents/list.txt", headers=H, json=body, timeout=60)
              if put.status_code in (200, 201):
                ok = True
                print(f"list.txt 已更新（{len(song_dirs)} 首）")
                break
              if put.status_code in (409, 422):
                print(f"list.txt 写入冲突，重试 {attempt + 1}/3...")
                time.sleep(3)
                continue
              put.raise_for_status()
            if not ok:
              raise RuntimeError("list.txt 写入冲突，重试后仍失败")
          PYEOF

      - name: Commit and push to goodurl
        run: |
          git config user.name "lingyicute" && git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to clean."
            exit 0
          fi
          git commit -m "cleanup: 删除已归档的 JSON [skip archive]"
          git push origin HEAD:goodurl || (echo "push 冲突，rebase 重试..." && git pull --rebase origin goodurl && git push origin HEAD:goodurl)

  refetch:
    # 补抓 archive 阶段因链接损坏而缺失的封面 / 歌词，并维护 main/missing.txt
    # 放在 cleanup 之后串行执行：避免同一轮里两个 job 同时往 main 提交
    # !cancelled()：即使 cleanup 因为 API 限流之类的原因失败，补抓照跑
    needs: cleanup
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main（音乐库）
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet mutagen requests

      - name: Refetch missing covers and lyrics
        env:
          MAIN_DIR: main
          MAX_ATTEMPTS: '5'      # 同一条目最多补抓次数，超过后只在 missing.txt 留档不再重试
          PER_RUN_LIMIT: '40'    # 单次运行最多尝试多少条，避免 job 超时
          RETRY_TOTAL: '3'
          MIN_COVER_BYTES: '1024'
        run: |
          python3 - <<'PYEOF'
          # ===== SHARED-HELPERS-BEGIN =====
          # 本区块在 archive.yml 和 cleanup.yml 里各存一份，必须【逐字一致】。
          # tests/test_shared_block.py 会做字节级比对，改一处就得改两处。
          # 为了保持两边一致，这里会有一两个对某个 workflow 用不到的 import，别顺手删。
          import datetime
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import requests
          from requests.adapters import HTTPAdapter
          from urllib3.util.retry import Retry
          import mutagen
          from mutagen.id3 import ID3, APIC, TIT2, TPE1
          from mutagen.mp4 import MP4, MP4Cover
          from mutagen.flac import FLAC, Picture

          UA = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
              "Referer": "https://y.qq.com/",
          }
          AUDIO_EXTS = {".mp3", ".m4a", ".mp4", ".flac", ".ogg", ".oga", ".wav", ".aac", ".wma", ".opus"}
          IMG_EXT = {"jpeg": ".jpg", "png": ".png", "webp": ".webp", "gif": ".gif"}
          IMG_MIME = {"jpeg": "image/jpeg", "png": "image/png", "webp": "image/webp", "gif": "image/gif"}
          MIN_COVER_BYTES = int(os.environ.get("MIN_COVER_BYTES", "1024"))
          RETRY_TOTAL = int(os.environ.get("RETRY_TOTAL", "3"))

          def make_session():
              """带自动重试的 Session：封面/歌词/音频三条下载链路共用。"""
              s = requests.Session()
              retry = Retry(
                  total=RETRY_TOTAL,
                  connect=RETRY_TOTAL,
                  read=RETRY_TOTAL,
                  status=RETRY_TOTAL,
                  backoff_factor=1.0,
                  status_forcelist=(429, 500, 502, 503, 504),
                  allowed_methods=frozenset(["GET", "HEAD"]),
                  raise_on_status=False,          # 交给调用方的 raise_for_status 统一处理
                  respect_retry_after_header=False,  # 无视 Retry-After，避免被 CDN 拖到 job 超时
              )
              adapter = HTTPAdapter(max_retries=retry, pool_connections=8, pool_maxsize=8)
              s.mount("https://", adapter)
              s.mount("http://", adapter)
              s.headers.update(UA)
              return s

          SESSION = make_session()

          def normalize_url(u):
              """补全协议相对链接（QQ 音乐有时给 //y.gtimg.cn/...），其余原样返回。
              任何类型都不抛异常：字段可能是 null / 数字 / 数组，畸形 JSON 不能拖垮整批。"""
              u = "" if u is None else str(u)
              u = u.strip()
              return "https:" + u if u.startswith("//") else u

          def brief_error(e):
              """把异常压成一个短标记，写进 info.json 的 coverError / lyricError。"""
              if isinstance(e, (RuntimeError, ValueError)) and str(e):
                  return str(e)[:60]          # 自定义校验原因，如 too_small(103B) / not_image / not_lrc
              if isinstance(e, requests.HTTPError):
                  r = getattr(e, "response", None)
                  if r is not None:
                      return f"HTTP {r.status_code}"
                  return "HTTPError"
              if isinstance(e, requests.Timeout):
                  return "Timeout"
              if isinstance(e, requests.ConnectionError):
                  return "ConnectionError"
              return type(e).__name__

          def download(url, dest, timeout=120):
              """先写 .part 再原子改名：中途断流不会在目标目录留下半截文件。"""
              dest = Path(dest)
              part = dest.with_name(dest.name + ".part")
              try:
                  r = SESSION.get(url, stream=True, timeout=timeout)
                  try:
                      r.raise_for_status()
                  finally:
                      if r.status_code >= 400:
                          r.close()
                  with open(part, "wb") as f:
                      for chunk in r.iter_content(1024 * 64):
                          if chunk:
                              f.write(chunk)
                  ctype = r.headers.get("Content-Type", "")
                  part.rename(dest)
                  return ctype
              finally:
                  part.unlink(missing_ok=True)

          def sniff_image(path):
              """按文件头判断真实图片类型，返回 jpeg/png/webp/gif 或 None。"""
              try:
                  with open(path, "rb") as f:
                      head = f.read(16)
              except Exception:
                  return None
              if head[:3] == b"\xff\xd8\xff":
                  return "jpeg"
              if head[:8] == b"\x89PNG\r\n\x1a\n":
                  return "png"
              if head[:4] == b"RIFF" and head[8:12] == b"WEBP":
                  return "webp"
              if head[:6] in (b"GIF87a", b"GIF89a"):
                  return "gif"
              return None

          def looks_like_html(text):
              """直链失效时 CDN 可能返回 200 + 错误页；真歌词正文里不会出现 HTML 标签。"""
              t = text.lstrip()[:2000]
              low = t.lower()
              if low.startswith("<!doctype") or low.startswith("<html") or low.startswith("<?xml"):
                  return True
              return re.search(r"<\s*[a-z!/][^>]*>", t, re.I) is not None

          def lyric_looks_ok(text):
              """lrc 直链的内容校验，只挡三种明显不是歌词的响应。返回 (ok, reason)。"""
              t = (text or "").strip()
              if not t:
                  return False, "empty"          # 空文件 / 全空白
              if looks_like_html(t):
                  return False, "html_page"      # 404 错误页之类
              if t.startswith("{") and t.endswith("}"):
                  return False, "not_lrc"        # 直链失效后返回的 JSON 错误体
              return True, None

          def fetch_lyric_text(url):
              """lrc 字段固定是 .lrc 文件直链，直接当纯文本取回。"""
              r = SESSION.get(url, timeout=60)
              r.raise_for_status()
              raw = r.content
              # 中文 lrc 常见 GBK 编码，utf-8 解不动时退回 gb18030，避免乱码
              for enc in ("utf-8", "gb18030"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
              return raw.decode("utf-8", errors="replace")

          def write_tags(audio_path, title, author):
              """只写标题/艺术家。与封面解耦：没有封面时也会调用，避免音频变成无名文件。"""
              ext = audio_path.suffix.lower()
              try:
                  if ext == ".mp3":
                      try:
                          tags = ID3(str(audio_path))
                      except Exception:
                          tags = ID3()
                      tags.delall("TIT2")
                      tags.delall("TPE1")
                      tags.add(TIT2(encoding=3, text=title))
                      tags.add(TPE1(encoding=3, text=author))
                      tags.save(str(audio_path))
                  elif ext in (".m4a", ".mp4"):
                      mp4 = MP4(str(audio_path))
                      if mp4.tags is None:
                          mp4.add_tags()
                      mp4["\xa9nam"] = [title]
                      mp4["\xa9ART"] = [author]
                      mp4.save()
                  elif ext == ".flac":
                      fl = FLAC(str(audio_path))
                      fl["title"] = title
                      fl["artist"] = author
                      fl.save()
                  else:
                      # ogg / opus / wav / wma 等：交给 mutagen 通用层尽力写入
                      f = mutagen.File(str(audio_path))
                      if f is None:
                          print(f"    {ext} 格式无法识别，跳过 tag 写入")
                          return False
                      if f.tags is None:
                          f.add_tags()
                      if isinstance(f.tags, ID3):
                          f.tags.delall("TIT2")
                          f.tags.delall("TPE1")
                          f.tags.add(TIT2(encoding=3, text=title))
                          f.tags.add(TPE1(encoding=3, text=author))
                      else:
                          f.tags["title"] = title
                          f.tags["artist"] = author
                      f.save()
                  return True
              except Exception as e:
                  print(f"    写标题/艺术家 tag 失败({ext}): {e}")
                  return False

          def embed_cover(audio_path, cover_path):
              """只负责嵌入封面图。返回 True/False。"""
              try:
                  data = cover_path.read_bytes()
              except Exception as e:
                  print(f"    读取封面失败: {e}")
                  return False
              kind = sniff_image(cover_path) or "jpeg"
              mime = IMG_MIME.get(kind, "image/jpeg")
              ext = audio_path.suffix.lower()
              try:
                  if ext == ".mp3":
                      try:
                          tags = ID3(str(audio_path))
                      except Exception:
                          tags = ID3()
                      tags.delall("APIC")
                      tags.add(APIC(encoding=3, mime=mime, type=3, desc="Cover", data=data))
                      tags.save(str(audio_path))
                  elif ext in (".m4a", ".mp4"):
                      mp4 = MP4(str(audio_path))
                      if mp4.tags is None:
                          mp4.add_tags()
                      fmt = MP4Cover.FORMAT_JPEG if mime == "image/jpeg" else MP4Cover.FORMAT_PNG
                      mp4["covr"] = [MP4Cover(data, imageformat=fmt)]
                      mp4.save()
                  elif ext == ".flac":
                      fl = FLAC(str(audio_path))
                      fl.clear_pictures()
                      pic = Picture()
                      pic.data = data
                      pic.type = 3
                      pic.mime = mime
                      pic.desc = "Cover"
                      fl.add_picture(pic)
                      fl.save()
                  else:
                      # wav / ogg / opus 等：能拿到 ID3 容器就嵌，拿不到就只留独立封面文件
                      f = mutagen.File(str(audio_path))
                      if f is None:
                          print(f"    {ext} 格式无法识别，保留独立封面文件")
                          return False
                      if f.tags is None:
                          f.add_tags()
                      if isinstance(f.tags, ID3):
                          f.tags.delall("APIC")
                          f.tags.add(APIC(encoding=3, mime=mime, type=3, desc="Cover", data=data))
                          f.save()
                          return True
                      print(f"    {ext} 的 tag 容器不支持封面，保留独立封面文件")
                      return False
                  return True
              except Exception as e:
                  print(f"    嵌入封面失败({ext}): {e}")
                  return False
          # ===== SHARED-HELPERS-END =====

          import shutil
          import tempfile

          MAIN = Path(os.environ.get("MAIN_DIR", "main"))
          MISSING = MAIN / "missing.txt"
          MAX_ATTEMPTS = int(os.environ.get("MAX_ATTEMPTS", "5"))
          PER_RUN_LIMIT = int(os.environ.get("PER_RUN_LIMIT", "40"))
          NO_RETRY_REASONS = {"no_url"}   # 没有链接可补，只在 missing.txt 里留档
          # 下载暂存放在仓库外：即使 job 被硬中断（超时/OOM），也不会有半成品被 git add -A 提交进 main
          WORK = Path(tempfile.mkdtemp(prefix="refetch-"))

          HEADER = (
              "# missing.txt — 由 cleanup workflow 的 refetch job 自动生成/维护\n"
              "# 来源：各歌曲文件夹 info.json 里的 picOk / lrcOk（archive 软失败时写入）\n"
              "# 列（TAB 分隔）：folder  kind(cover|lyric)  reason  attempts  lastAttempt  url\n"
              "# attempts 达到上限后不再重试，条目保留在此供人工排查\n"
          )

          def find_audio(folder):
              best = None
              for p in folder.glob("song.*"):
                  if p.suffix.lower() in AUDIO_EXTS and p.is_file():
                      if best is None or p.stat().st_size > best.stat().st_size:
                          best = p
              return best

          def clean_field(v):
              return str(v if v is not None else "").replace("\t", " ").replace("\n", " ").strip()

          def load_attempts():
              """读取上一轮 missing.txt 里的 attempts / lastAttempt。"""
              hist = {}
              if not MISSING.exists():
                  return hist
              for line in MISSING.read_text(encoding="utf-8").splitlines():
                  if not line.strip() or line.startswith("#"):
                      continue
                  cols = line.split("\t")
                  if len(cols) < 5:
                      continue
                  try:
                      attempts = int(cols[3])
                  except ValueError:
                      attempts = 0
                  hist[(cols[0], cols[1])] = {"attempts": attempts, "lastAttempt": cols[4], "reason": cols[2]}
              return hist

          def save_info(folder, info):
              (folder / "info.json").write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def now_iso():
              return datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")

          def parse_iso(s):
              try:
                  return datetime.datetime.fromisoformat(str(s).replace("Z", "+00:00"))
              except Exception:
                  return None

          # ---- 1) 扫描 main，找出所有缺资源的文件夹 ----------------------------------
          hist = load_attempts()
          targets = []
          scanned = 0
          for folder in sorted(p for p in MAIN.iterdir() if p.is_dir()):
            if folder.name.startswith("."):
              continue
            info_path = folder / "info.json"
            if not info_path.is_file():
              continue
            try:
              info = json.loads(info_path.read_text(encoding="utf-8"))
            except Exception as e:
              print(f"[WARN] {folder.name}: info.json 解析失败: {e}")
              continue
            scanned += 1
            files = info.get("files") or {}
            pic = normalize_url(info.get("pic"))
            lrc = normalize_url(info.get("lrc"))
            # 兼容旧版 info.json（没有 picOk / lrcOk 字段）：按有没有落地文件推断
            pic_ok = info.get("picOk")
            if pic_ok is None:
              pic_ok = bool(files.get("cover"))
            lrc_ok = info.get("lrcOk")
            if lrc_ok is None:
              lrc_ok = bool(files.get("lyric"))

            for kind, ok_flag, url, err_key in (
              ("cover", pic_ok, pic, "coverError"),
              ("lyric", lrc_ok, lrc, "lyricError"),
            ):
              if ok_flag:
                  continue
              reason = clean_field(info.get(err_key)) or "legacy_unknown"
              if not url.startswith("http"):
                  reason = "no_url"
              h = hist.get((folder.name, kind), {})
              attempts = int(h.get("attempts", 0))
              last = h.get("lastAttempt", "")
              # 文件夹被重新归档过（链接是新的）→ 失败计数归零，别拿旧账直接 GIVEUP
              archived_at, last_at = parse_iso(info.get("archivedAt")), parse_iso(last)
              if attempts and archived_at and last_at and archived_at > last_at:
                print(f"[RESET] {folder.name} [{kind}]: 已重新归档，attempts {attempts} -> 0")
                attempts, last = 0, ""
              targets.append({
                  "folder": folder.name,
                  "kind": kind,
                  "reason": reason,
                  "url": url,
                  "attempts": attempts,
                  "lastAttempt": last,
              })
          print(f"扫描 info.json: {scanned} 个；待补抓条目: {len(targets)} 条")

          # ---- 2) 逐条补抓 ----------------------------------------------------------
          fixed = failed = given_up = deferred = skipped = 0
          budget = PER_RUN_LIMIT
          for t in sorted(targets, key=lambda x: (x["attempts"], x["folder"], x["kind"])):
            folder = MAIN / t["folder"]
            kind = t["kind"]
            tag = f'{t["folder"]} [{kind}]'

            if t["reason"] in NO_RETRY_REASONS or not t["url"].startswith("http"):
              skipped += 1
              print(f"[SKIP] {tag}: 没有可用链接（{t['reason']}），仅留档")
              continue
            if t["attempts"] >= MAX_ATTEMPTS:
              given_up += 1
              print(f"[GIVEUP] {tag}: 已尝试 {t['attempts']} 次，最后原因 {t['reason']}")
              continue
            if budget <= 0:
              deferred += 1
              print(f"[DEFER] {tag}: 本轮补抓额度({PER_RUN_LIMIT})用完，下一轮再试")
              continue
            budget -= 1

            info_path = folder / "info.json"
            try:
              info = json.loads(info_path.read_text(encoding="utf-8"))
            except Exception as e:
              t["reason"] = "info_unreadable"
              t["attempts"] += 1
              t["lastAttempt"] = now_iso()
              failed += 1
              print(f"[FAIL] {tag}: info.json 读不出来: {e}")
              continue

            stage = WORK / f'{t["folder"]}.{kind}'    # 仓库外的暂存文件
            dest = None
            try:
              if kind == "cover":
                download(t["url"], stage)
                size = stage.stat().st_size
                img_kind = sniff_image(stage)
                if size < MIN_COVER_BYTES:
                  raise RuntimeError(f"too_small({size}B)")
                if img_kind is None:
                  raise RuntimeError("not_image")
                dest = folder / ("cover" + IMG_EXT[img_kind])
                shutil.move(str(stage), str(dest))
                audio = find_audio(folder)
                title = str(info.get("title", "") or "")
                author = str(info.get("author", "") or "")
                tagged = bool((info.get("files") or {}).get("tagsWritten"))
                embedded = False
                if audio is not None:
                  # write_tags 是幂等的（先 delall 再写）：老归档在没封面时连标题/艺术家都没写，
                  # 这里无脑补一遍，顺便兜住 info.json 说写了但实际没写的情况
                  if title and author:
                    tagged = write_tags(audio, title, author) or tagged
                  embedded = embed_cover(audio, dest)
                  print(f"    嵌入封面: {'成功' if embedded else '失败/不支持（已保留独立封面）'}")
                files = info.setdefault("files", {})
                files["cover"] = dest.name
                files["coverEmbedded"] = embedded
                files["tagsWritten"] = tagged
                info["picOk"] = True
                info["coverError"] = None
                info["refetchedCoverAt"] = now_iso()
              else:
                text = fetch_lyric_text(t["url"])
                ok_l, why = lyric_looks_ok(text)
                if not ok_l:
                  raise RuntimeError(why)
                dest = folder / "lyric.lrc"
                dest.write_text(text, encoding="utf-8")
                files = info.setdefault("files", {})
                files["lyric"] = dest.name
                info["lrcOk"] = True
                info["lyricError"] = None
                info["refetchedLyricAt"] = now_iso()

              save_info(folder, info)
              fixed += 1
              print(f"[FIXED] {tag}: 已补齐 -> {dest.name}")
              t["_done"] = True
            except Exception as e:
              if dest is not None:
                dest.unlink(missing_ok=True)   # 别把补到一半的文件留在库里
              t["reason"] = clean_field(brief_error(e)) or "unknown"
              t["attempts"] += 1
              t["lastAttempt"] = now_iso()
              failed += 1
              left = MAX_ATTEMPTS - t["attempts"]
              print(f"[FAIL] {tag}: {t['reason']} / {e} （已尝试 {t['attempts']}/{MAX_ATTEMPTS}，剩余 {max(left, 0)} 次）")
            finally:
              stage.unlink(missing_ok=True)

          # ---- 3) 重写 missing.txt（只保留仍然缺失的条目）---------------------------
          remain = [t for t in targets if not t.get("_done")]
          lines = [HEADER.rstrip("\n")]
          for t in sorted(remain, key=lambda x: (x["folder"], x["kind"])):
            lines.append("\t".join([
              clean_field(t["folder"]),
              t["kind"],
              clean_field(t["reason"]) or "unknown",
              str(t["attempts"]),
              clean_field(t["lastAttempt"]),
              clean_field(t["url"]),
            ]))
          MISSING.write_text("\n".join(lines) + "\n", encoding="utf-8")

          shutil.rmtree(WORK, ignore_errors=True)
          print(f"补抓结果: 成功 {fixed} / 失败 {failed} / 放弃 {given_up} / 顺延 {deferred} / 无链接跳过 {skipped}")
          print(f"missing.txt: 剩余 {len(remain)} 条待补")
          # 补抓失败不影响 workflow 状态：明天还会再试，直到 MAX_ATTEMPTS
          PYEOF

      - name: Commit and push to main
        run: |
          cd main
          git config user.name "lingyicute"
          git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          TOUCHED=$(git -c core.quotePath=false diff --cached --name-only | cut -d/ -f1 | sort -u)
          git commit -m "refetch: 补抓缺失的封面/歌词 [skip archive]" -m "$TOUCHED"
          git push origin HEAD:main || (echo "push 冲突，rebase 重试..." && git pull --rebase origin main && git push origin HEAD:main)

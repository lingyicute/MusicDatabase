# Workflow 1：归档 — goodurl 有新 JSON 上报时运行
#
# 功能：遍历 goodurl 分支的 *.json，下载专辑图/歌曲文件/歌词，
# 把专辑图嵌入歌曲文件（同时保留独立的专辑图文件），
# 保存到 main 分支的【歌名-歌手】文件夹，然后把 main commit 回去。
#
# 安装位置（注意：两个分支都要有，缺一不可）：
#   main 分支    ：.github/workflows/archive.yml   （定时/手动任务从默认分支读取，归档逻辑也以此为准）
#   goodurl 分支 ：.github/workflows/archive.yml   （push 触发的 workflow 必须存在于被 push 的分支）
# 最简单的同步办法：先合到 main，再把 main merge 到 goodurl。
#
# 配套设置：仓库 Settings → Actions → General → Workflow permissions → 选 "Read and write permissions"。

name: Archive goodurl to main

on:
  push:
    branches: [goodurl]
    paths:
      - '**.json'
  workflow_dispatch:

concurrency:
  group: archive-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    # cleanup workflow 的提交带 [skip archive]，避免删 JSON 时又空跑一遍
    if: "!contains(github.event.head_commit.message, '[skip archive]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout goodurl（待归档 JSON）
        uses: actions/checkout@v4
        with:
          ref: goodurl
          path: goodurl
          fetch-depth: 1

      - name: Checkout main（音乐库）
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet mutagen requests

      - name: Archive pending songs
        env:
          GOODURL_DIR: goodurl
          MAIN_DIR: main
          JSON_DIR: '' # 必须与 Worker 的 JSON_DIR 一致，默认根目录
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys
          from pathlib import Path
          from urllib.parse import urlparse, unquote
          import requests
          import mutagen
          from mutagen.mp3 import MP3
          from mutagen.id3 import ID3, APIC, TIT2, TPE1
          from mutagen.mp4 import MP4, MP4Cover
          from mutagen.flac import FLAC, Picture

          GOODURL = Path(os.environ.get("GOODURL_DIR", "goodurl"))
          MAIN = Path(os.environ.get("MAIN_DIR", "main"))
          JSON_DIR = os.environ.get("JSON_DIR", "").strip().strip("/")
          SRC = GOODURL / JSON_DIR if JSON_DIR else GOODURL

          UA = {
            "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36",
            "Referer": "https://y.qq.com/",
          }
          AUDIO_EXTS = {".mp3", ".m4a", ".mp4", ".flac", ".ogg", ".oga", ".wav", ".aac", ".wma", ".opus"}
          MIN_AUDIO_BYTES = 50 * 1024  # 小于此值视为下载失败（可能是错误页）
          MIN_DURATION = 60            # 服务端二次校验：时长必须 >60s

          def ext_from_url(u, default):
            try:
              ext = os.path.splitext(unquote(urlparse(u).path))[1].lower()
              if re.fullmatch(r"\.[a-z0-9]{2,5}", ext):
                return ext
            except Exception:
              pass
            return default

          def download(url, dest, timeout=120):
            r = requests.get(url, headers=UA, stream=True, timeout=timeout)
            r.raise_for_status()
            with open(dest, "wb") as f:
              for chunk in r.iter_content(1024 * 64):
                if chunk:
                  f.write(chunk)
            return r.headers.get("Content-Type", "")

          def audio_duration(path):
            try:
              f = mutagen.File(str(path))
              if f is not None and getattr(f, "info", None) is not None:
                L = getattr(f.info, "length", 0) or 0
                return float(L)
            except Exception as e:
              print(f"    读取时长失败（继续归档）: {e}")
            return None

          def embed_cover(audio_path, cover_path, title, author):
            """把封面嵌入音频 tags，同时保留独立封面文件。返回 True/False。"""
            try:
              data = cover_path.read_bytes()
            except Exception as e:
              print(f"    读取封面失败: {e}")
              return False
            suffix = cover_path.suffix.lower()
            mime = "image/png" if suffix == ".png" else ("image/webp" if suffix == ".webp" else "image/jpeg")
            ext = audio_path.suffix.lower()
            try:
              if ext == ".mp3":
                try:
                  tags = ID3(str(audio_path))
                except Exception:
                  tags = ID3()
                tags.delall("APIC")
                tags.add(APIC(encoding=3, mime=mime, type=3, desc="Cover", data=data))
                tags.add(TIT2(encoding=3, text=title))
                tags.add(TPE1(encoding=3, text=author))
                tags.save(str(audio_path))
              elif ext in (".m4a", ".mp4"):
                mp4 = MP4(str(audio_path))
                fmt = MP4Cover.FORMAT_JPEG if mime == "image/jpeg" else MP4Cover.FORMAT_PNG
                mp4["covr"] = [MP4Cover(data, imageformat=fmt)]
                mp4["\xa9nam"] = [title]
                mp4["\xa9ART"] = [author]
                mp4.save()
              elif ext == ".flac":
                fl = FLAC(str(audio_path))
                pic = Picture()
                pic.data = data
                pic.type = 3
                pic.mime = mime
                pic.desc = "Cover"
                fl.add_picture(pic)
                fl["title"] = title
                fl["artist"] = author
                fl.save()
              else:
                print(f"    {ext} 格式不支持嵌入 tags，保留原文件 + 独立封面")
                return False
              return True
            except Exception as e:
              print(f"    嵌入封面失败({ext}): {e}")
              return False

          def fetch_lyric_text(url):
            r = requests.get(url, headers=UA, timeout=60)
            r.raise_for_status()
            text = r.content.decode("utf-8", errors="replace")
            t = text.strip()
            if t.startswith("{"):
              try:
                j = json.loads(t)
                for k in ("lyric", "lrc", "data"):
                  if isinstance(j.get(k), str) and j[k].strip():
                    return j[k]
              except Exception:
                pass
            return text

          def process_one(json_path):
            try:
              record = json.loads(json_path.read_text(encoding="utf-8"))
            except Exception as e:
              print(f"[SKIP] {json_path.name}: JSON 解析失败: {e}")
              return "skip"
            title = str(record.get("title", "")).strip()
            author = str(record.get("author", "")).strip()
            pic = str(record.get("pic", "")).strip()
            file_url = str(record.get("url", "")).strip()
            lrc = str(record.get("lrc", "")).strip()
            if not title or not author or not file_url.startswith("http"):
              print(f"[SKIP] {json_path.name}: 字段缺失/非法")
              return "skip"

            # 文件夹名直接沿用 JSON 文件名（不含 .json），保证与 cleanup 的对照逻辑一致
            folder_name = json_path.stem
            target = MAIN / folder_name

            # 已归档（文件夹存在且有音频文件）→ 跳过
            if target.is_dir():
              for p in target.glob("song.*"):
                if p.suffix.lower() in AUDIO_EXTS and p.stat().st_size > MIN_AUDIO_BYTES:
                  print(f"[SKIP] {folder_name}: main 已存在，跳过")
                  return "skip"

            print(f"[PROC] {folder_name}")
            tmp = target.with_name(target.name + ".__tmp__")
            if tmp.exists():
              import shutil
              shutil.rmtree(tmp, ignore_errors=True)
            tmp.mkdir(parents=True, exist_ok=True)
            try:
              # 1) 下载歌曲文件
              audio_ext = ext_from_url(file_url, ".mp3")
              if audio_ext not in AUDIO_EXTS:
                audio_ext = ".mp3"
              audio_tmp = tmp / ("song" + audio_ext)
              print(f"    下载歌曲: {file_url[:90]}...")
              ctype = download(file_url, audio_tmp)
              if audio_tmp.stat().st_size < MIN_AUDIO_BYTES:
                raise RuntimeError(f"歌曲文件过小({audio_tmp.stat().st_size}B)，可能已过期或被拒")
              # 纠正扩展名：URL 没带扩展名时按内容推断
              if audio_ext == ".mp3" and "mp4" in (ctype or ""):
                fixed = tmp / "song.m4a"
                audio_tmp.rename(fixed)
                audio_tmp = fixed
              dur = audio_duration(audio_tmp)
              if dur is not None and dur <= MIN_DURATION:
                raise RuntimeError(f"实际时长 {dur:.1f}s ≤ 60s，丢弃")
              if dur:
                print(f"    时长: {dur:.1f}s")

              # 2) 下载专辑图
              cover_file = None
              if pic.startswith("http"):
                try:
                  print(f"    下载封面: {pic[:90]}...")
                  ctype_img = download(pic, tmp / "cover.bin")
                  ctype_img = (ctype_img or "").lower()
                  if "png" in ctype_img:
                    cover_ext = ".png"
                  elif "webp" in ctype_img:
                    cover_ext = ".webp"
                  else:
                    cover_ext = ext_from_url(pic, ".jpg")
                    if cover_ext not in (".jpg", ".jpeg", ".png", ".webp"):
                      cover_ext = ".jpg"
                  cover_file = tmp / ("cover" + cover_ext)
                  (tmp / "cover.bin").rename(cover_file)
                  if cover_file.stat().st_size < 1024:
                    print("    封面过小，丢弃封面")
                    cover_file.unlink(missing_ok=True)
                    cover_file = None
                except Exception as e:
                  print(f"    封面下载失败（继续归档歌曲）: {e}")
              else:
                print("    无封面 url，跳过封面")

              # 3) 下载歌词
              lyric_file = None
              if lrc.startswith("http"):
                try:
                  print(f"    下载歌词: {lrc[:90]}...")
                  text = fetch_lyric_text(lrc)
                  if text.strip():
                    lyric_file = tmp / "lyric.lrc"
                    lyric_file.write_text(text, encoding="utf-8")
                  else:
                    print("    歌词为空，跳过")
                except Exception as e:
                  print(f"    歌词下载失败（继续归档歌曲）: {e}")
              else:
                print("    无歌词 url，跳过歌词")

              # 4) 嵌入封面（独立封面文件保留不删）
              embedded = False
              if cover_file is not None:
                embedded = embed_cover(audio_tmp, cover_file, title, author)
                print(f"    嵌入封面: {'成功' if embedded else '失败/不支持（已保留独立封面）'}")

              # 5) 写 info.json
              import datetime
              info = {
                "title": title,
                "author": author,
                "pic": pic,
                "url": file_url,
                "lrc": lrc,
                "songmid": str(record.get("songmid", "")),
                "duration": record.get("duration"),
                "reportedAt": record.get("reportedAt"),
                "archivedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
                "files": {
                  "audio": audio_tmp.name,
                  "cover": cover_file.name if cover_file else None,
                  "lyric": lyric_file.name if lyric_file else None,
                  "coverEmbedded": embedded,
                },
              }
              (tmp / "info.json").write_text(json.dumps(info, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

              # 6) 落盘：tmp 原子替换为正式文件夹
              if target.exists():
                import shutil
                shutil.rmtree(target, ignore_errors=True)
              tmp.rename(target)
              print(f"[OK] {folder_name} -> {audio_tmp.name}")
              return "ok"
            except Exception as e:
              import shutil
              shutil.rmtree(tmp, ignore_errors=True)
              print(f"[FAIL] {folder_name}: {e}")
              return "fail"

          jsons = sorted([p for p in SRC.glob("*.json") if p.is_file()])
          print(f"goodurl 待处理 JSON: {len(jsons)} 个")
          ok = fail = skip = 0
          for jp in jsons:
            r = process_one(jp)
            if r == "ok":
              ok += 1
            elif r == "fail":
              fail += 1
            else:
              skip += 1
          print(f"归档结果: 成功 {ok} / 失败 {fail} / 跳过 {skip}")
          # 个别歌曲失败不让整个 workflow 失败（过期 url 等下一轮新上报覆盖后重试）
          PYEOF

      - name: Commit and push to main
        run: |
          cd main
          git config user.name "lingyicute"
          git config user.email "160479206+lingyicute@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          NEW_DIRS=$(git diff --cached --name-only | cut -d/ -f1 | sort -u | tr '\n' ' ')
          git commit -m "archive: 归档歌曲 ${NEW_DIRS}"
          git push origin HEAD:main || (echo "push 冲突，rebase 重试..." && git pull --rebase origin main && git push origin HEAD:main)
